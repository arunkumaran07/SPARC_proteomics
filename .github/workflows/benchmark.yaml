on:
  push:
    branches: [main]
  pull_request:

name: benchmark

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::ggplot2
            any::data.table
            local::.
      - name: Run benchmark with regression checks
        run: Rscript benchmark/run_benchmark.R --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmark/RESULTS.md
            benchmark/results/
